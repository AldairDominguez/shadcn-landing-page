<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Estadísticas - Rutalegal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .current-stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .stat-value {
            color: #333;
            font-weight: 700;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚙️ Actualizar Estadísticas</h1>
        <p class="subtitle">Panel de administración - Rutalegal</p>

        <div class="current-stats" id="currentStats">
            <div class="loading">Cargando estadísticas actuales...</div>
        </div>

        <form id="updateForm">
            <div class="form-group">
                <label for="visits">👁️ Visitas</label>
                <input type="number" id="visits" name="visits" value="1900" min="0" required>
            </div>

            <div class="form-group">
                <label for="likes">❤️ Me gusta (Corazones)</label>
                <input type="number" id="likes" name="likes" value="1000" min="0" required>
            </div>

            <button type="submit" id="submitBtn">
                Actualizar Estadísticas
            </button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        const API_BASE = '/.netlify/functions';

        // Fetch current stats
        async function fetchCurrentStats() {
            try {
                const response = await fetch(`${API_BASE}/stats?action=get`);
                if (response.ok) {
                    const data = await response.json();
                    displayCurrentStats(data);
                }
            } catch (error) {
                console.error('Error fetching stats:', error);
                document.getElementById('currentStats').innerHTML =
                    '<div class="loading">Error al cargar estadísticas</div>';
            }
        }

        function displayCurrentStats(data) {
            document.getElementById('currentStats').innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">Visitas actuales</span>
                    <span class="stat-value">${data.visits.toLocaleString()}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Me gusta actuales</span>
                    <span class="stat-value">${data.likes.toLocaleString()}</span>
                </div>
            `;
        }

        // Handle form submission
        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            const visits = parseInt(document.getElementById('visits').value);
            const likes = parseInt(document.getElementById('likes').value);

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Actualizando...';
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/set-stats`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ visits, likes }),
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = `✅ ¡Estadísticas actualizadas! Visitas: ${visits.toLocaleString()}, Me gusta: ${likes.toLocaleString()}`;

                    // Refresh current stats
                    setTimeout(() => {
                        fetchCurrentStats();
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Error al actualizar');
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = `❌ Error: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Actualizar Estadísticas';
            }
        });

        // Load current stats on page load
        fetchCurrentStats();
    </script>
</body>

</html>
