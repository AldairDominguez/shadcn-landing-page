# Netlify configuration for Suprema Legal

[build]
  # Directory to build the project
  command = "npm run build"
  # Directory that contains the deploy-ready HTML files and assets
  publish = "dist"
  # Directory for Netlify Functions
  functions = "netlify/functions"

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Allow PDFs to be embedded in iframes
[[headers]]
  for = "/assets/articles/*.pdf"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Type = "application/pdf"
